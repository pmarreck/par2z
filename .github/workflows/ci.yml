name: CI

on:
  push:
    branches: [ yolo ]
  pull_request:
    branches: [ yolo ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-linux-musl
            os: ubuntu-latest
          - target: aarch64-linux-musl
            os: ubuntu-latest
          - target: x86_64-windows
            os: windows-latest
          - target: aarch64-windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Test (Native Only)
        if: matrix.target == 'x86_64-linux-musl' || matrix.target == 'aarch64-macos' || matrix.target == 'x86_64-windows'
        run: zig build test-direct

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp -r zig-out/bin/* artifacts/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: par2z-cli-${{ matrix.target }}
          path: artifacts/
